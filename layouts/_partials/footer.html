<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-links">
      {{ with .Site.Language.Params.friendshipLinks }}
      <div class="footer-section">
        <h3 class="footer-title">{{ T "friendLinks" }}</h3>
        <ul class="friend-links">
          {{ range . }}
          <li><a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a></li>
          {{ end }}
        </ul>
      </div>
      {{ end }}

      <div class="footer-section">
        <h3 class="footer-title">{{ T "more" }}</h3>
        <ul class="footer-menu">
          <li><a href="{{ "/archive/" | relLangURL }}">{{ T "archive" }}</a></li>
          <li><a href="{{ "/sitemap.xml" | relLangURL }}">{{ T "sitemap" }}</a></li>
        </ul>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2026 - {{ now.Year }} <a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>. 
        {{ T "madeWith" }} <a href="https://gohugo.io/" target="_blank" rel="noopener">Hugo</a></p>
    </div>
  </div>
</footer>
